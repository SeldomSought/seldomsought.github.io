<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas responsive review</title><style>body{margin:0;background:#d5d9df;font:13px Arial;color:#173a77}header{height:45px;display:flex;gap:10px;align-items:center;padding:0 15px}button{padding:6px 12px;color:inherit;background:#fff;border:1px solid #9aabc6;cursor:pointer}#stage{margin:0 auto;position:relative}iframe{display:block;border:0;transform-origin:top left;background:#f3eee3}output{margin-left:auto;font-size:11px}</style><header><b>Atlas review</b><button data-width="1440">Desktop 1440</button><button data-width="768">Tablet 768</button><button data-width="390">Mobile 390</button><button id="nojs">Disable page JavaScript</button><output id="metrics"></output></header><div id="stage"><iframe title="Expertise preview" src="../expertise.html" width="1440" height="940"></iframe></div><script>const f=document.querySelector('iframe'),stage=document.querySelector('#stage');let width=1440;function fit(){const scale=Math.min(1,(innerWidth-36)/width);f.width=width;f.height=Math.floor((innerHeight-55)/scale);f.style.transform=`scale(${scale})`;stage.style.width=width*scale+'px';stage.style.height=f.height*scale+'px'}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);fit()});document.querySelector('#nojs').onclick=()=>{f.setAttribute('sandbox','allow-same-origin');f.src=f.src;document.querySelector('#nojs').textContent='Page JavaScript disabled'};window.addEventListener('resize',fit);fit();setInterval(()=>{try{const d=f.contentDocument;document.querySelector('#metrics').textContent=width+'px · '+(d.documentElement.scrollWidth>width?'OVERFLOW':'no overflow')+' · '+d.querySelectorAll('.atlas-place[open]').length+' notes open'}catch(e){}},800);</script></html>
